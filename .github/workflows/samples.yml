name: Measure per-worker times within scoring phases
on:
  push:
    branches: [bench/worker-phase-distribution]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current, seed: 345139}
          - {events: 60000000, format: current, seed: 345139}
          - {events: 20000000, format: current, seed: 756191}
          - {events: 60000000, format: current, seed: 756191}
    env:
      SEED: ${{ matrix.seed }}
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: ca09a75a98461c83a42e3e5430adbd17280916d4
      CANDIDATE: 0305122403982f7be66266962ebfd9b8799c9eb3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          mkdir "$RUNNER_TEMP/profile-src"
          git archive "$RANKED" | tar -x -C "$RUNNER_TEMP/profile-src"
          cd "$RUNNER_TEMP/profile-src"
          docker build -q -t sampled .
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed "$SEED" --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Run with both matched and eight software workers
        run: |
          cd "$RUNNER_TEMP"
          for workers in "$(nproc)" 8; do
            for trial in 1 2 3; do
              out="$RUNNER_TEMP/output-$workers-$trial"
              mkdir -p "$out"
              chmod 777 "$out"
              echo "PROFILE_START $workers $trial"
              docker run --rm --network none --read-only --cap-drop ALL --user 1000:1000 --memory 12g --memory-swap 12g -v "$RUNNER_TEMP/data:/data:ro" -v "$out:/output" -e NCPU="$workers" sampled
            done
          done
