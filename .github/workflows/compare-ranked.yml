name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 4500000, format: current, seed: 990617}
    env:
      SEED: ${{ matrix.seed }}
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: 3b74f4fbfa088ae4eceaf976e9b63f8e6d2a9db2
      CANDIDATE: 0305122403982f7be66266962ebfd9b8799c9eb3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          tree="$RUNNER_TEMP/build"
          mkdir "$tree"
          git archive "$RANKED" | tar -x -C "$tree"
          cd "$tree"
          sed -i '/^WORKDIR \/src/a ENV CARGO_PROFILE_RELEASE_STRIP=none' Dockerfile
          sed -i 's/-C linker=\$linker/-C link-arg=-Wl,--emit-relocs -C linker=$linker/g' Dockerfile
          docker build -q -t uninstrumented .
          cid=$(docker create uninstrumented)
          docker cp "$cid:/app" "$RUNNER_TEMP/app"
          docker rm "$cid"
      - name: Instrument hot-path release executables for edge counting
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p profile
          docker run --rm -v "$RUNNER_TEMP/app:/app" debian:trixie-slim sh -ec '
            apt-get update -qq
            apt-get install -y --no-install-recommends bolt-19
            for level in v3 v4 wide; do
              llvm-bolt-19 /app/shopping-sessions.$level -o /app/instrumented.$level --instrument --instrumentation-file=/profile/$level.fdata
            done'
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed "$SEED" --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Train on generated data and confirm each symbol profile contains observations
        run: |
          cd "$RUNNER_TEMP"
          mkdir out
          for level in v3 v4 wide; do
            if [ "$level" != v3 ] && ! grep -qw avx512bw /proc/cpuinfo; then continue; fi
            if [ "$level" = wide ] && ! grep -qw avx512_vbmi2 /proc/cpuinfo; then continue; fi
            docker run --rm -e NCPU=8 -v "$RUNNER_TEMP/app:/app:ro" -v "$RUNNER_TEMP/data:/data:ro" -v "$RUNNER_TEMP/out:/output" -v "$RUNNER_TEMP/profile:/profile" uninstrumented /app/instrumented.$level
            test -s "profile/$level.fdata"
          done
          ls -lh profile
      - uses: actions/upload-artifact@v4
        with:
          name: native-edge-counts
          path: ${{ runner.temp }}/profile/*.fdata
