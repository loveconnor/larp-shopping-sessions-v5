name: Collect profiles for the shared-name implementation
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4660d6bba6b7c627eefa5e71657394b46149d23d
      - name: Generate v5 training input and collect LLVM counters
        run: |
          grep -qw avx512bw /proc/cpuinfo
          cd "$RUNNER_TEMP"
          curl -fsSLO https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo build --release --locked --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed 807311 --events 20000000 --clicks 5000000 --threads "$(nproc)" --output "$RUNNER_TEMP/train"
          mkdir "$RUNNER_TEMP/profile"
          docker run --rm -v "$GITHUB_WORKSPACE/native:/src:ro" -v "$RUNNER_TEMP:/work" rust:1.90-slim-bookworm sh -ec '
            cp -a /src /tmp/native
            cd /tmp/native
            rustup component add llvm-tools-preview
            merger="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
            for level in v3 v4; do
              mkdir /work/profile/$level
              RUSTFLAGS="-C target-cpu=x86-64-$level -Cprofile-generate=/work/profile/$level" cargo build --release --locked --target x86_64-unknown-linux-gnu
              NCPU=4 DATA_DIR=/work/train OUTPUT_DIR=/work/out-$level target/x86_64-unknown-linux-gnu/release/shopping-sessions
              "$merger" merge --sparse /work/profile/$level/*.profraw -o /work/profile/$level.profdata
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: shared-counters
          path: ${{ runner.temp }}/profile/*.profdata
