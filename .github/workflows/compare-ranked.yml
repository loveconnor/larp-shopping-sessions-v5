name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current, seed: 856909}
    env:
      SEED: ${{ matrix.seed }}
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: 22a11e6d0bfff5f8779fa0fdbe8ef0f5c169e2e8
      CANDIDATE: 0305122403982f7be66266962ebfd9b8799c9eb3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          mkdir "$RUNNER_TEMP/profile-src"
          git archive "$RANKED" | tar -x -C "$RUNNER_TEMP/profile-src"
          cd "$RUNNER_TEMP/profile-src"
          sed -i '/^WORKDIR \/src/a ENV CARGO_PROFILE_RELEASE_DEBUG=line-tables-only CARGO_PROFILE_RELEASE_STRIP=none' Dockerfile
          sed -i 's/install -y --no-install-recommends libjemalloc2/install -y --no-install-recommends libjemalloc2 google-perftools binutils/' Dockerfile
          docker build -q -t sampled .
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed "$SEED" --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Sample native CPU time at source lines with the ranked allocator and engine
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p sampled-out profile
          chmod 777 sampled-out profile
          docker run --rm -v "$RUNNER_TEMP/data:/data:ro" -v "$RUNNER_TEMP/profile:/profile" \
            -v "$RUNNER_TEMP/sampled-out:/output" -e NCPU=8 sampled sh -ec '
              for trial in 1 2 3; do
                CPUPROFILE=/profile/cpu-$trial CPUPROFILE_FREQUENCY=1000 LD_PRELOAD=libjemalloc.so.2:libprofiler.so.0 /app/shopping-sessions
              done
              ls -lh /profile
              binary=$(strings /profile/cpu-1* | sed -n "s|.* \(/app/shopping-sessions\.[^ ]*\)$|\1|p" | head -1)
              test -x "$binary"
              echo "Sampled engine $binary"
              google-pprof --text --lines "$binary" /profile/cpu-* > /profile/lines.txt
              google-pprof --text "$binary" /profile/cpu-* > /profile/functions.txt
              head -65 /profile/lines.txt
              head -45 /profile/functions.txt
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cpu-samples
          path: ${{ runner.temp }}/profile/
