name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  actions: read
  contents: read
jobs:
  native-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Download the sampled release and raw native CPU stacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44987745210 -R loveconnor/larp-shopping-sessions-v5 -n native-cpu-samples -D profile
      - name: Map executable file offsets through ELF virtual addresses and include inline frames
        shell: python
        run: |
          import sys, pathlib,re,struct,collections,subprocess
          d=pathlib.Path('profile')
          exe=(d/'engine').read_bytes()
          phoff,=struct.unpack_from('<Q',exe,32)
          sz,count=struct.unpack_from('<HH',exe,54)
          load=[struct.unpack_from('<IIQQQQQQ',exe,phoff+i*sz) for i in range(count)]
          counts=collections.Counter()
          total=0
          for f in d.glob('cpu-*'):
           data=f.read_bytes()
           maps=[(int(a,16),int(b,16),int(off,16)) for a,b,off in re.findall(rb'(?m)^([a-f0-9]+)-([a-f0-9]+) r-xp ([a-f0-9]+) .*?/app/shopping-sessions[^\n]*',data)]
           pos=40
           while True:
            n,depth=struct.unpack_from('<QQ',data,pos);pos+=16
            ip,=struct.unpack_from('<Q',data,pos);pos+=depth*8
            if depth==1 and ip==0:break
            total+=n
            for a,b,off in maps:
             if not a<=ip<b:continue
             ofs=ip-a+off
             for typ,flags,pofs,va,_,filesize,_,_ in load:
              if typ==1 and pofs<=ofs<pofs+filesize: counts[ofs-pofs+va]+=n;break
          ips=list(counts)
          raw=subprocess.check_output(['addr2line','-a','-i','-f','-e',str(d/'engine')],input=''.join(f'{ip:x}\n' for ip in ips),text=True)
          loc=collections.Counter();full=collections.Counter()
          for ip,group in zip(ips,re.split(r'(?m)^0x[0-9a-f]+\n',raw)[1:]):
           lines=group.strip().splitlines()
           user=next((x for x in lines[1::2] if re.search(r'/(main|keys|scan|pq|ts)\.rs:',x)),lines[1])
           loc[user]+=counts[ip]
           full[tuple(lines[1::2])]+=counts[ip]
          print('in-executable',sum(counts.values()),'total',total)
          for x,c in loc.most_common(24):print(c,round(c/total*100,1),x)
          for x,c in full.most_common(8):print(c,x[:5])
