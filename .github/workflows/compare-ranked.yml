name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current, seed: 673907}
          - {events: 60000000, format: current, seed: 673907}
          - {events: 20000000, format: current, seed: 673919}
          - {events: 60000000, format: current, seed: 673919}
    env:
      SEED: ${{ matrix.seed }}
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: 2182f2fd4c92f5fa44fbe9202cfe90533644b3db
      CANDIDATE: 0305122403982f7be66266962ebfd9b8799c9eb3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          mkdir "$RUNNER_TEMP/src"
          git archive "$RANKED" | tar -x -C "$RUNNER_TEMP/src"
          cp "$RUNNER_TEMP/src/Dockerfile" "$RUNNER_TEMP/src/Dockerfile.original"
          cp "$RUNNER_TEMP/src/Dockerfile.original" "$RUNNER_TEMP/src/Dockerfile"
          docker build -q -t ranked "$RUNNER_TEMP/src"
          sed 's@-Cprofile-use=@-Cllvm-args=--align-loops=32 -Cprofile-use=@' "$RUNNER_TEMP/src/Dockerfile.original" > "$RUNNER_TEMP/src/Dockerfile" 
          docker build -q -t loop32 "$RUNNER_TEMP/src"
          sed 's@-Cprofile-use=@-Cllvm-args=--align-loops=64 -Cprofile-use=@' "$RUNNER_TEMP/src/Dockerfile.original" > "$RUNNER_TEMP/src/Dockerfile" 
          docker build -q -t loop64 "$RUNNER_TEMP/src"
          sed 's@-Cprofile-use=@-Cllvm-args=--hot-cold-split -Cprofile-use=@' "$RUNNER_TEMP/src/Dockerfile.original" > "$RUNNER_TEMP/src/Dockerfile" 
          docker build -q -t cold "$RUNNER_TEMP/src"
          sed 's@-Cprofile-use=@-Cllvm-args=--enable-ext-tsp-block-placement -Cprofile-use=@' "$RUNNER_TEMP/src/Dockerfile.original" > "$RUNNER_TEMP/src/Dockerfile" 
          docker build -q -t placement "$RUNNER_TEMP/src"
          sed 's@-Cprofile-use=@-Cllvm-args=--x86-cmov-converter=false -Cprofile-use=@' "$RUNNER_TEMP/src/Dockerfile.original" > "$RUNNER_TEMP/src/Dockerfile" 
          docker build -q -t keep-cmov "$RUNNER_TEMP/src"
          sed 's@-Cprofile-use=@-Cllvm-args=--enable-gvn-hoist -Cprofile-use=@' "$RUNNER_TEMP/src/Dockerfile.original" > "$RUNNER_TEMP/src/Dockerfile" 
          docker build -q -t hoist "$RUNNER_TEMP/src"
          sed 's@-Cprofile-use=@-Cllvm-args=--align-all-nofallthru-blocks=4 -Cprofile-use=@' "$RUNNER_TEMP/src/Dockerfile.original" > "$RUNNER_TEMP/src/Dockerfile" 
          docker build -q -t targets16 "$RUNNER_TEMP/src"
          for d in /sys/devices/system/cpu/cpu0/cache/index*; do paste -d' ' "$d/level" "$d/type" "$d/size" "$d/shared_cpu_list"; done
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed "$SEED" --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Measure cache partition sizes with exact table equality
        shell: python
        run: |
          import datetime,json,os,pathlib,random,subprocess,statistics
          import duckdb
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          total=int(os.environ['EVENTS'])
          variants={'ranked': {}, 'loop32': {}, 'loop64': {}, 'cold': {}, 'placement': {}, 'keep-cmov': {}, 'hoist': {}, 'targets16': {}}
          cpus=','.join(str(x) for x in sorted(os.sched_getaffinity(0))[:8])
          print('CACHETEST',cpus,total,flush=True)
          samples={k:[] for k in variants}
          def stamp(s): return datetime.datetime.fromisoformat(s.removesuffix('Z')[:26]+'+00:00')
          def take(k):
              out=root/f'cache-{k}'
              out.mkdir(exist_ok=True);out.chmod(0o777)
              env={'NCPU':'8','MEM_GB':'24','DATA_DIR':'/data','OUTPUT_DIR':'/output','SCRATCH_DIR':'/scratch',**variants[k]}
              args=['docker','create','--cpuset-cpus',cpus,'--memory','12g','--memory-swap','12g','--network','none','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges','--user','1000:1000','--tmpfs','/tmp:rw,size=64m','--tmpfs','/scratch:rw,mode=1777','-v',f'{root}/data:/data:ro','-v',f'{out}:/output']
              for key,value in env.items():args+=['-e',f'{key}={value}']
              cid=subprocess.check_output(args+[k],text=True).strip()
              try:
                  subprocess.run(['docker','start','-a',cid],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  st=json.loads(subprocess.check_output(['docker','inspect',cid]))[0]['State'];assert st['ExitCode']==0
                  return (stamp(st['FinishedAt'])-stamp(st['StartedAt'])).total_seconds()
              finally:subprocess.run(['docker','rm','-f',cid],stdout=subprocess.DEVNULL)
          def verify(k):
              for table in ('user_daily','campaign_daily'):
                  a,b=[f"SELECT * FROM read_parquet('{root}/cache-{v}/{table}/*.parquet')" for v in ('ranked',k)]
                  for x,y in ((a,b),(b,a)):assert duckdb.sql(f'SELECT count(*) FROM ({x} EXCEPT ALL {y})').fetchone()[0]==0
          take('ranked')
          for rnd in range(7):
              order=list(variants);random.Random(3521+rnd).shuffle(order)
              for k in order:
                  t=take(k)
                  if rnd:samples[k].append(t)
                  elif k!='ranked':verify(k)
          ref=statistics.median(samples['ranked'])
          for k in sorted(samples,key=lambda x:statistics.median(samples[x])):print('LLVM_RESULT',k,round(statistics.median(samples[k])/ref,4),flush=True)

