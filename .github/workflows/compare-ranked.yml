name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current}
    env:
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: bcda580b0ee9a3258a03c10c5f789fd3487adf59
      CANDIDATE: e113993b83eb1bdbee910601b6750fd17b90ebd2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          for label in ranked; do
            sha=$CANDIDATE
            if [ "$label" = ranked ]; then sha=$RANKED; fi
            if [ "$label" = sizing ]; then sha=af5fb050f273f23452a8a1023c52d8a38f4ce407; fi
            mkdir "$RUNNER_TEMP/$label-src"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/$label-src"
            sed -i '/^COPY native/i ENV CARGO_PROFILE_RELEASE_STRIP=none CARGO_PROFILE_RELEASE_DEBUG=1' "$RUNNER_TEMP/$label-src/Dockerfile"
            docker build -q -t "$label" "$RUNNER_TEMP/$label-src"
            cid=$(docker create "$label")
            docker cp "$cid:/app/shopping-sessions" "$RUNNER_TEMP/$label"
            docker rm "$cid"
          done
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed 350907 --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Sample the scored pipeline on native hardware
        run: |
          cd "$RUNNER_TEMP"
          cat > sample.c <<'EOF'
          #define _GNU_SOURCE
          #include <link.h>
          #include <signal.h>
          #include <stdint.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/time.h>
          #include <ucontext.h>
          static uintptr_t base;
          static int fd;
          static int main_image(struct dl_phdr_info *p,size_t n,void *arg) {
              if (!*p->dlpi_name) { base=p->dlpi_addr; return 1; }
              return 0;
          }
          static void sample(int sig,siginfo_t *info,void *ctx) {
              uintptr_t pc=((ucontext_t*)ctx)->uc_mcontext.gregs[REG_RIP]-base;
              write(fd,&pc,sizeof(pc));
          }
          __attribute__((constructor)) static void start(void) {
              dl_iterate_phdr(main_image,0);
              fd=open("sample.pc",O_WRONLY|O_CREAT|O_TRUNC|O_APPEND,0600);
              struct sigaction sa={.sa_sigaction=sample,.sa_flags=SA_SIGINFO|SA_RESTART};
              sigaction(SIGPROF,&sa,0);
              struct itimerval timer={{0,1000},{0,1000}};
              setitimer(ITIMER_PROF,&timer,0);
          }
          EOF
          gcc -O2 -shared -fPIC sample.c -o sample.so
          mkdir prof-out
          LD_PRELOAD="$PWD/sample.so" DATA_DIR="$PWD/data" OUTPUT_DIR="$PWD/prof-out" NCPU="$(nproc)" "$PWD/ranked"
          python - <<'PYTHON'
          import array,collections,subprocess
          a=array.array("Q")
          a.frombytes(open("sample.pc","rb").read())
          data=subprocess.check_output(["addr2line","-C","-f","-e","ranked"],input="".join(f"{x:x}\n" for x in a),text=True).splitlines()
          print("SAMPLES",len(a))
          for k,v in collections.Counter(data[::2]).most_common(25): print("FUNC",v,k)
          for k,v in collections.Counter(data[1::2]).most_common(40): print("LINE",v,k)
          PYTHON
