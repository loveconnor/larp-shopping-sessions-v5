name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current, seed: 813301}
          - {events: 60000000, format: current, seed: 813301}
          - {events: 20000000, format: current, seed: 813341}
          - {events: 60000000, format: current, seed: 813341}
    env:
      SEED: ${{ matrix.seed }}
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: 22a11e6d0bfff5f8779fa0fdbe8ef0f5c169e2e8
      CANDIDATE: e613867a81ffac146787533d80bbe1b48e7ec395
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          for label in ranked candidate; do
            sha=$CANDIDATE
            if [ "$label" = ranked ]; then sha=$RANKED; fi
            if [ "$label" = v4 ]; then sha=47bb8b73aa5f9ee3ac5a11fb1d5b429d0cff3c8a; fi
            mkdir "$RUNNER_TEMP/$label-src"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/$label-src"
            docker build -q -t "$label" "$RUNNER_TEMP/$label-src"
            cid=$(docker create "$label")
            mkdir "$RUNNER_TEMP/$label"
            docker cp "$cid:/app/." "$RUNNER_TEMP/$label/"
            docker rm "$cid"
          done
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed "$SEED" --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Alternate fresh restricted runc containers and compare both complete output tables
        shell: python
        run: |
          import datetime, json, os, pathlib, shutil, statistics, subprocess
          import duckdb

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          cpus = sorted(os.sched_getaffinity(0))[:8]
          cpuset = ",".join(map(str, cpus))
          labels = ["ranked", "candidate"]
          samples = {label: [] for label in labels}
          print(f"Native CPUs {cpuset}; eight software workers; 12 GiB/no swap", flush=True)
          scratch = root / "scratch"
          scratch.mkdir(mode=0o777)
          scratch.chmod(0o777)
          for round_number in range(6):
              for label in labels[::1 if round_number % 2 == 0 else -1]:
                  output = root / f"{label}-out-{round_number}"
                  output.mkdir()
                  output.chmod(0o777)
                  args = ["docker", "create", "--runtime", "runc", "--cpuset-cpus", cpuset,
                      "--memory", "12g", "--memory-swap", "12g", "--network", "none",
                      "--read-only", "--user", "1000:1000", "--cap-drop", "ALL",
                      "--security-opt", "no-new-privileges", "--tmpfs", "/tmp:rw,nosuid,nodev,size=64m",
                      "-e", "DATA_DIR=/data", "-e", "OUTPUT_DIR=/output", "-e", "SCRATCH_DIR=/scratch",
                      "-e", "HOME=/scratch", "-e", "NCPU=8", "-e", "MEM_GB=24",
                      "-v", f"{root}/data:/data:ro", "-v", f"{output}:/output", "-v", f"{scratch}:/scratch", label]
                  cid = subprocess.check_output(args, text=True).strip()
                  try:
                      subprocess.run(["docker", "start", "-a", cid], check=True)
                      state = json.loads(subprocess.check_output(["docker", "inspect", cid]))[0]["State"]
                      assert state["ExitCode"] == 0 and not state["OOMKilled"], state
                      def stamp(value):
                          return datetime.datetime.fromisoformat(value[:26] + "+00:00")
                      seconds = (stamp(state["FinishedAt"]) - stamp(state["StartedAt"])).total_seconds()
                      if round_number:
                          samples[label].append(seconds)
                      print(f"Round {round_number} {label} {seconds:.6f} s", flush=True)
                  finally:
                      subprocess.run(["docker", "rm", "-f", cid], check=True, stdout=subprocess.DEVNULL)
          for table in ("user_daily", "campaign_daily"):
              a, b = [f"SELECT * FROM read_parquet('{root}/{label}-out-5/{table}/*.parquet')" for label in labels]
              for lhs, rhs in ((a,b),(b,a)):
                  assert duckdb.sql(f"SELECT count(*) FROM ({lhs} EXCEPT ALL {rhs})").fetchone()[0] == 0
          for label in labels:
              m = statistics.median(samples[label])
              print(f"RESULT {label} {m:.6f} s, ratio {m/statistics.median(samples['ranked']):.4f}, both tables match", flush=True)

      - name: Verify both candidates at eight workers on the 36 published cases and the official dev answer
        if: matrix.events == 20000000 && matrix.format == 'current'
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/starter-polars.zip"
          curl --retry 3 -fsSLO "$track/dev-answer.zip"
          unzip -q starter-polars.zip
          echo 'c2439e0e2e7456d721852814e9928e077648803d5c57a1760a40c7d3b0864d20  dev-answer.zip' | sha256sum -c
          unzip -q dev-answer.zip
          cargo run --locked --release --manifest-path generator/Cargo.toml -- --seed 1 --events 1000000 --clicks 250000 --threads 4 --output "$RUNNER_TEMP/dev-data"
          for label in candidate; do
            for fixture in starter-polars/fixtures/*/; do
              rm -rf verify-out
              mkdir -p verify-out
              DATA_DIR="$RUNNER_TEMP/$fixture/input" OUTPUT_DIR="$RUNNER_TEMP/verify-out" SCRATCH_DIR="$RUNNER_TEMP/scratch" NCPU=8 "./$label/shopping-sessions"
              python "$GITHUB_WORKSPACE/tools/compare.py" verify-out "$fixture/expected"
            done
            rm -rf verify-out
            mkdir -p verify-out
            DATA_DIR="$RUNNER_TEMP/dev-data" OUTPUT_DIR="$RUNNER_TEMP/verify-out" SCRATCH_DIR="$RUNNER_TEMP/scratch" NCPU=8 "./$label/shopping-sessions"
            python "$GITHUB_WORKSPACE/tools/compare.py" verify-out dev-answer
          done
