name: Validate Shopping Sessions scorer compatibility
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  fleet:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        replica: [1, 2]
    timeout-minutes: 25
    env:
      CANDIDATE: c1a1c95cec8a4528e62d41de89a7f52dc78a7691
      RANKED: 2495dfc9e31fe401f60bade9b07508a5933a2766
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and inspect the submitted CPU-dispatched image
        run: |
          for name in ranked measured candidate; do
            sha=$RANKED
            if [ "$name" = candidate ]; then sha=$CANDIDATE; fi
            if [ "$name" = measured ]; then sha=5f2932c10611efc59c2f44d53efd8218344173ae; fi
            src="$RUNNER_TEMP/$name"
            mkdir "$src"
            git archive "$sha" | tar -x -C "$src"
            docker build -q -t "$name" "$src"
            id=$(docker create "$name")
            docker cp "$id:/app" "$src/app"
            docker rm "$id"
          done
          for level in v3 v4; do
            cmp "$RUNNER_TEMP/ranked/app/shopping-sessions.$level" "$RUNNER_TEMP/candidate/app/shopping-sessions.$level"
          done
          cmp "$RUNNER_TEMP/measured/app/shopping-sessions.wide" "$RUNNER_TEMP/candidate/app/shopping-sessions.wide"
          for level in base v3 v4 wide; do
            test -x "$RUNNER_TEMP/candidate/app/shopping-sessions.$level"
          done
      - name: Prepare the official one-million-event development data and answer
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          curl --retry 3 -fsSLO "$track/dev-answer.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          echo 'c2439e0e2e7456d721852814e9928e077648803d5c57a1760a40c7d3b0864d20  dev-answer.zip' | sha256sum -c
          unzip -q generator.zip
          unzip -q dev-answer.zip
          cargo run -q --release --locked --manifest-path generator/Cargo.toml -- --seed 1 --events 1000000 --clicks 250000 --threads 4 --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
          docker run --rm -v "$RUNNER_TEMP:/dest" debian:bookworm-slim sh -ec 'apt-get update -qq && apt-get install -y --no-install-recommends -qq qemu-user-static && install -m 755 /usr/bin/qemu-x86_64-static /dest/qemu-x86_64-static' 
      - name: Validate CPU dispatch, baseline and AVX2 under emulation and native runc on this host
        run: |
          cpus=$(python -c 'import os;print(",".join(map(str,sorted(os.sched_getaffinity(0))[:8])))')
          echo "Native test CPUs $cpus"
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          mkdir -p "$RUNNER_TEMP/scratch"
          chmod 777 "$RUNNER_TEMP/scratch"
          modes=(native nehalem-select nehalem-core haswell-select haswell-core)
          if grep -qw avx512bw /proc/cpuinfo; then modes+=(native-v4); fi
          if grep -qw avx512_vbmi2 /proc/cpuinfo; then modes+=(native-wide); fi
          for mode in "${modes[@]}"; do
            out="$RUNNER_TEMP/out-$mode"
            mkdir "$out"
            chmod 777 "$out"
            opts=(--rm --runtime runc --read-only --network none --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges --cpuset-cpus "$cpus" --memory 6g --memory-swap 6g --tmpfs /tmp:rw,nosuid,nodev,size=64m -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch -e NCPU=8 -e MEM_GB=24 -v "$RUNNER_TEMP/data:/data:ro" -v "$out:/output" -v "$RUNNER_TEMP/scratch:/scratch")
            case "$mode" in
              native) docker run "${opts[@]}" candidate ;;
              native-v4) docker run "${opts[@]}" --entrypoint /app/shopping-sessions.v4 candidate ;;
              native-wide) docker run "${opts[@]}" --entrypoint /app/shopping-sessions.wide candidate ;;
              *)
                model=Nehalem; level=base
                if [[ "$mode" = haswell-* ]]; then model=Haswell; level=v3; fi
                cmd=(docker run "${opts[@]}" --entrypoint /qemu -v "$RUNNER_TEMP/qemu-x86_64-static:/qemu:ro" candidate -cpu "$model")
                if [[ "$mode" = *-core ]]; then
                  "${cmd[@]}" "/app/shopping-sessions.$level"
                else
                  "${cmd[@]}" -strace /app/shopping-sessions 2>"$RUNNER_TEMP/$mode.trace"
                  grep -F "execve(\"/app/shopping-sessions.$level\"" "$RUNNER_TEMP/$mode.trace"
                fi
                ;;
            esac
            python tools/compare.py "$out" "$RUNNER_TEMP/dev-answer"
          done
