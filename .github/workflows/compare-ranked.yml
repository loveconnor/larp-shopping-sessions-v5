name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current, seed: 534113}
          - {events: 60000000, format: current, seed: 534113}
          - {events: 20000000, format: current, seed: 534127}
          - {events: 60000000, format: current, seed: 534127}
    env:
      SEED: ${{ matrix.seed }}
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: 2495dfc9e31fe401f60bade9b07508a5933a2766
      CANDIDATE: 7a65b9c2534a370c4394ed62b9c8f45688deb189
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          for label in ranked candidate v4; do
            sha=$CANDIDATE
            if [ "$label" = ranked ]; then sha=$RANKED; fi
            if [ "$label" = v4 ]; then sha=c7f6ed3b024dedbec89dad15da76030b44b3b992; fi
            mkdir "$RUNNER_TEMP/$label-src"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/$label-src"
            docker build -q -t "$label" "$RUNNER_TEMP/$label-src"
            cid=$(docker create "$label")
            mkdir "$RUNNER_TEMP/$label"
            docker cp "$cid:/app/." "$RUNNER_TEMP/$label/"
            docker rm "$cid"
          done
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed "$SEED" --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Alternate process-start-to-exit runs and compare all Parquet rows
        shell: python
        run: |
          import os, pathlib, shutil, statistics, subprocess, time
          import duckdb

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          cpus = len(os.sched_getaffinity(0))
          workers = min(cpus, 8)
          for cpu in os.sched_getaffinity(0):
              print(cpu,pathlib.Path(f"/sys/devices/system/cpu/cpu{cpu}/topology/thread_siblings_list").read_text().strip())
          print(f"Available CPUs {cpus}, workers {workers}", flush=True)
          labels = ["ranked", "candidate", "v4"]
          samples = {label: [] for label in labels}
          scratch = root / "scratch"
          scratch.mkdir()
          for budget in [workers]:
              samples = {label: [] for label in labels}
              for round_number in range(6):
                  order = labels[round_number % len(labels):] + labels[:round_number % len(labels)]
                  for label in order:
                      output = root / (label + "-out")
                      if output.exists():
                          shutil.rmtree(output)
                      output.mkdir()
                      env = dict(os.environ, DATA_DIR=str(root / "data"), OUTPUT_DIR=str(output),
                                 SCRATCH_DIR=str(scratch), NCPU=str(budget))
                      start = time.perf_counter()
                      subprocess.run([str(root / label / "shopping-sessions")], env=env, check=True)
                      seconds = time.perf_counter() - start
                      print(f"Round {round_number} {label} {seconds:.6f} s", flush=True)
                      if round_number:
                          samples[label].append(seconds)
              print("AFFINITY", budget, {k:statistics.median(v) for k,v in samples.items()}, flush=True)
          for table in ["user_daily", "campaign_daily"]:
              queries = [f"SELECT * FROM read_parquet('{root}/{label}-out/{table}/*.parquet')" for label in labels]
              for b in queries[1:]:
                  for lhs, rhs in [(queries[0], b), (b, queries[0])]:
                      if duckdb.sql(f"SELECT count(*) FROM ({lhs} EXCEPT ALL {rhs})").fetchone()[0]:
                          raise ValueError(f"{table} differs for {b}")
          for label in labels:
              median = statistics.median(samples[label])
              print(f"RESULT {label} {median:.6f} s, ratio {median/statistics.median(samples['ranked']):.4f}, both tables match", flush=True)

      - name: Verify both candidates at eight workers on the 36 published cases and the official dev answer
        if: matrix.events == 20000000 && matrix.format == 'current'
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/starter-polars.zip"
          curl --retry 3 -fsSLO "$track/dev-answer.zip"
          unzip -q starter-polars.zip
          echo 'c2439e0e2e7456d721852814e9928e077648803d5c57a1760a40c7d3b0864d20  dev-answer.zip' | sha256sum -c
          unzip -q dev-answer.zip
          cargo run --locked --release --manifest-path generator/Cargo.toml -- --seed 1 --events 1000000 --clicks 250000 --threads 4 --output "$RUNNER_TEMP/dev-data"
          for label in candidate v4; do
            for fixture in starter-polars/fixtures/*/; do
              rm -rf verify-out
              mkdir -p verify-out
              DATA_DIR="$RUNNER_TEMP/$fixture/input" OUTPUT_DIR="$RUNNER_TEMP/verify-out" SCRATCH_DIR="$RUNNER_TEMP/scratch" NCPU=8 "./$label/shopping-sessions"
              python "$GITHUB_WORKSPACE/tools/compare.py" verify-out "$fixture/expected"
            done
            rm -rf verify-out
            mkdir -p verify-out
            DATA_DIR="$RUNNER_TEMP/dev-data" OUTPUT_DIR="$RUNNER_TEMP/verify-out" SCRATCH_DIR="$RUNNER_TEMP/scratch" NCPU=8 "./$label/shopping-sessions"
            python "$GITHUB_WORKSPACE/tools/compare.py" verify-out dev-answer
          done
