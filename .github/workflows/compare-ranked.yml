name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current}
    env:
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: bcda580b0ee9a3258a03c10c5f789fd3487adf59
      CANDIDATE: e113993b83eb1bdbee910601b6750fd17b90ebd2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          for label in ranked; do
            sha=$CANDIDATE
            if [ "$label" = ranked ]; then sha=$RANKED; fi
            if [ "$label" = sizing ]; then sha=af5fb050f273f23452a8a1023c52d8a38f4ce407; fi
            mkdir "$RUNNER_TEMP/$label-src"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/$label-src"
            sed -i '/^COPY native/i ENV CARGO_PROFILE_RELEASE_STRIP=none CARGO_PROFILE_RELEASE_DEBUG=1' "$RUNNER_TEMP/$label-src/Dockerfile"
            docker build -q -t "$label" "$RUNNER_TEMP/$label-src"
            cid=$(docker create "$label")
            docker cp "$cid:/app/shopping-sessions" "$RUNNER_TEMP/$label"
            docker rm "$cid"
          done
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed 350907 --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Sample the scored pipeline on native hardware
        run: |
          cd "$RUNNER_TEMP"
          perfbin=$(find /usr/lib/linux-tools -name perf -type f 2>/dev/null | head -1)
          if [ -z "$perfbin" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y linux-tools-generic >/dev/null
            perfbin=$(find /usr/lib/linux-tools -name perf -type f | head -1)
          fi
          mkdir prof-out
          sudo env DATA_DIR="$PWD/data" OUTPUT_DIR="$PWD/prof-out" NCPU="$(nproc)" "$perfbin" record -e cpu-clock -F 997 -o perf.data -- "$PWD/ranked"
          sudo "$perfbin" report --stdio -i perf.data --no-children --percent-limit 0.5 | head -90
