name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current, seed: 813113}
          - {events: 60000000, format: current, seed: 813113}
          - {events: 20000000, format: current, seed: 813187}
    env:
      SEED: ${{ matrix.seed }}
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: cc4c49a3794fecc6b9b155513ed427936df66f1b
      CANDIDATE: 0305122403982f7be66266962ebfd9b8799c9eb3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build available optimized engines
        run: |
          set -eu
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          cd "$RUNNER_TEMP"
          mkdir baseline
          git -C "$GITHUB_WORKSPACE" archive "$RANKED" | tar -x -C baseline
          docker build -q -t ranked baseline
          mkdir -p engines
          sed -e '1i#include <stdio.h>' -e 's/execv(path, argv);/puts(engine + 1); return 0;/' baseline/native/platform/select-engine.c > select.c
          cc -O2 select.c -o select
          engine=$(./select)
          echo "Official dispatcher selected $engine"
          if [ "$engine" = wide ]; then
            arch=wide; cpu=x86-64-v4; features="-C target-feature=+avx512vbmi2"; profile=wide; tune=znver4
            (cd baseline && patch -p1 < native/platform/wide.patch)
          elif [ "$engine" = v4 ]; then
            arch=v4; cpu=x86-64-v4; features=; profile=v4; tune=icelake-server
          else
            arch=v3; cpu=x86-64-v3; features=; profile=v5; tune=znver3
          fi
          echo "$arch" > arch
          cid=$(docker create ranked)
          docker cp "$cid:/app/shopping-sessions.$arch" engines/ranked
          docker rm "$cid"
          cp baseline/native/src/scan.rs pristine.rs
          for spec in off-0-0 t0-256-1 t0-4096-1 t0-4096-8 t0-8192-32 t1-1024-1 t1-4096-1 t1-4096-8 t1-16384-16; do
              mode=${spec%%-*}
              rest=${spec#*-}
              distance=${rest%-*}
              spacing=${rest#*-}
              python3 - "$mode" "$distance" "$spacing" <<'EDIT'
          from pathlib import Path
          import sys
          mode,distance,spacing=sys.argv[1:]
          s=Path('pristine.rs').read_text()
          key='fetch(p.wrapping_add(READ_AHEAD));'
          assert s.count(key)==1
          if mode=='off':
              s=s.replace(key,'')
          else:
              if mode=='t1':s=s.replace('_MM_HINT_T0','_MM_HINT_T1')
              call=f'fetch(p.wrapping_add({distance}));'
              if spacing!='1':call='if ((at-line_offset)/64)&'+str(int(spacing)-1)+'==0 {'+call+'}'
              if spacing!='1':s=s.replace('let mut at = line;', 'let line_offset=line; let mut at = line;')
              s=s.replace(key,call)
          Path('baseline/native/src/scan.rs').write_text(s)
          EDIT
              docker run --rm -v "$RUNNER_TEMP/baseline/native:/src:ro" -v "$RUNNER_TEMP/engines:/out" -w /src       -e "RUSTFLAGS=-C target-cpu=$cpu $features -Cprofile-use=/src/profile/$profile.profdata" -e CARGO_TARGET_DIR=/tmp/target       rust:1.90-slim-bookworm sh -ec "cargo build --locked --release && cp /tmp/target/release/shopping-sessions /out/$spec"
          done
          ls -l engines
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed "$SEED" --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Interleave compiler builds and compare their full outputs
        shell: python
        run: |
          import datetime,json,os,pathlib,random,statistics,subprocess
          import duckdb
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          arch=(root/'arch').read_text().strip()
          engines=sorted(p.name for p in (root/'engines').iterdir())
          cpu=','.join(str(i) for i in sorted(os.sched_getaffinity(0))[:8])
          samples={e:[] for e in engines}
          from datetime import datetime as dt
          def stamp(s):return dt.fromisoformat(s.removesuffix('Z')[:26]+'+00:00')
          def run(e,round):
              out=root/f'out-{e}';out.mkdir(exist_ok=True);out.chmod(0o777)
              args=['docker','create','--cpuset-cpus',cpu,'--memory','12g','--memory-swap','12g','--network','none','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges','--user','1000:1000','--tmpfs','/tmp:rw,size=64m','--tmpfs','/scratch:rw,mode=1777','-e','DATA_DIR=/data','-e','OUTPUT_DIR=/output','-e','SCRATCH_DIR=/scratch','-e','HOME=/scratch','-e','NCPU=8','-e','MEM_GB=24','-v',f'{root}/data:/data:ro','-v',f'{out}:/output','-v',f'{root}/engines/{e}:/app/shopping-sessions.{arch}:ro','ranked']
              cid=subprocess.check_output(args,text=True).strip()
              try:
                  subprocess.run(['docker','start','-a',cid],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  st=json.loads(subprocess.check_output(['docker','inspect',cid]))[0]['State']
                  assert st['ExitCode']==0 and not st['OOMKilled'],st
                  elapsed=(stamp(st['FinishedAt'])-stamp(st['StartedAt'])).total_seconds()
                  if round:samples[e].append(elapsed)
                  print('SAMPLE',round,e,elapsed,flush=True)
              finally:subprocess.run(['docker','rm','-f',cid],stdout=subprocess.DEVNULL)
          def check(e):
              for table in ('user_daily','campaign_daily'):
                  a,b=[f"SELECT * FROM read_parquet('{root}/out-{v}/{table}/*.parquet')" for v in ('ranked',e)]
                  for x,y in ((a,b),(b,a)):assert duckdb.sql(f'SELECT count(*) FROM ({x} EXCEPT ALL {y})').fetchone()[0]==0,e
          run('ranked',0)
          for rnd in range(5):
              batch=engines.copy();random.Random(121+rnd).shuffle(batch)
              for e in batch:
                  run(e,rnd)
                  if rnd==0 and e!='ranked':check(e)
          ref=statistics.median(samples['ranked'])
          for e in sorted(engines,key=lambda e:statistics.median(samples[e])):print('PREFETCH',arch,e,round(statistics.median(samples[e])/ref,4),flush=True)

