name: Check processor-specific release binaries against the published answers
on:
  push:
    branches: [bench/family-release-correctness]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the exact profiled, scheduled and sixteen-lane release images
        run: |
          lscpu | grep -E '^Model name:|^CPU family:|^Model:'
          for item in profile:c1f4dc0dc82197f71ea4bec36722688e2c7cf73f tuned:faf7a64332db78809a950daf53ca0326d906e420 combined:5085884a63d3e70c2a7bdd9702d058d1315dc5d2 wider:ae784b93b8e6f9606636c1aec8e9041efd810f74; do
            label=${item%%:*}
            sha=${item#*:}
            mkdir "$RUNNER_TEMP/$label-src" "$RUNNER_TEMP/$label"
            git archive "$sha" | tar -xC "$RUNNER_TEMP/$label-src"
            docker build -q -t "$label" "$RUNNER_TEMP/$label-src"
            cid=$(docker create "$label")
            docker cp "$cid:/app/." "$RUNNER_TEMP/$label/"
            docker rm "$cid"
          done
      - name: Run each release selector and every supported new engine on 36 fixtures and the official dev answer
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/starter-polars.zip"
          curl --retry 3 -fsSLO "$track/dev-answer.zip"
          unzip -q starter-polars.zip
          echo 'c2439e0e2e7456d721852814e9928e077648803d5c57a1760a40c7d3b0864d20  dev-answer.zip' | sha256sum -c
          unzip -q dev-answer.zip
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          python -m pip install --quiet duckdb==1.4.5
          cargo run --locked --release --manifest-path generator/Cargo.toml -- --seed 1 --events 1000000 --clicks 250000 --threads 4 --output "$RUNNER_TEMP/dev-data"
          executables=()
          for label in profile tuned combined wider; do
            executables+=("$RUNNER_TEMP/$label/shopping-sessions")
            if grep -qw avx512_vbmi2 /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo; then
              executables+=("$RUNNER_TEMP/$label/shopping-sessions.p19")
            fi
          done
          printf 'Checking executable %s\n' "${executables[@]}"
          for exe in "${executables[@]}"; do
            for fixture in starter-polars/fixtures/*/; do
              rm -rf verify-out
              mkdir -p verify-out
              DATA_DIR="$RUNNER_TEMP/$fixture/input" OUTPUT_DIR="$RUNNER_TEMP/verify-out" SCRATCH_DIR="$RUNNER_TEMP/scratch" NCPU=8 "$exe"
              python "$GITHUB_WORKSPACE/tools/compare.py" verify-out "$fixture/expected"
            done
            rm -rf verify-out
            mkdir -p verify-out
            DATA_DIR="$RUNNER_TEMP/dev-data" OUTPUT_DIR="$RUNNER_TEMP/verify-out" SCRATCH_DIR="$RUNNER_TEMP/scratch" NCPU=8 "$exe"
            python "$GITHUB_WORKSPACE/tools/compare.py" verify-out dev-answer
          done
