name: Compare sorting real shopper histories by length
on:
  push:
    branches: [bench/real-history-sorters]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [264757, 552263, 983777, 781673, 604171, 935789]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify AVX-512 sort engines
        run: |
          lscpu | grep -E '^Model name:|^CPU family:|^Model:'
          if grep -qw avx512bw /proc/cpuinfo; then echo 'CAPABLE=yes' >> "$GITHUB_ENV"; fi
      - name: Generate independent data and collect real unsorted timestamp histories
        if: env.CAPABLE == 'yes'
        run: |
          python "$GITHUB_WORKSPACE/.github/workflows/history_sort.py"
          cd "$RUNNER_TEMP"
          curl --retry 3 -fsSLo generator.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path generator/Cargo.toml -- --seed ${{ matrix.seed }} --events 20000000 --clicks 5000000 --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          mkdir histories output
          docker run --rm -v "$RUNNER_TEMP:/study" -w /study -e DATA_DIR=/study/data -e OUTPUT_DIR=/study/output -e HISTORIES=/study/histories -e NCPU=8 rust:1.90-slim-bookworm cargo run --release --locked --manifest-path candidate/native/Cargo.toml
      - name: Compare four native sorters on the identical captured counts and values
        if: env.CAPABLE == 'yes'
        run: |
          cd "$RUNNER_TEMP"
          mkdir native-check
          git -C "$GITHUB_WORKSPACE" archive 5403f8a7e02a7663123d07a5b5073a8cf8722b93 native | tar xf - -C native-check
          docker run --rm -v "$RUNNER_TEMP:/study" -w /study -e RUSTFLAGS=-Ctarget-cpu=x86-64-v4 rust:1.90-slim-bookworm cargo test --release --locked --manifest-path native-check/native/Cargo.toml merged_histories_match_unsigned_sort
          cp "$GITHUB_WORKSPACE/.github/workflows/history_sort.rs" .
          docker run --rm -v "$RUNNER_TEMP:/study" -w /study rust:1.90-slim-bookworm sh -c 'rustc --edition 2024 -Awarnings -O -Ctarget-cpu=x86-64-v4 history_sort.rs -o /tmp/compare && /tmp/compare'
