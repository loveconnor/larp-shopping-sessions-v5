name: Compare algorithm changes after training each program on the same independent data
on:
  push:
    branches: [bench/matched-profile-algorithms]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current, seed: 223753}
          - {events: 60000000, format: current, seed: 223753}
          - {events: 20000000, format: current, seed: 783731}
          - {events: 60000000, format: current, seed: 783731}
    env:
      SEED: ${{ matrix.seed }}
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: 2182f2fd4c92f5fa44fbe9202cfe90533644b3db
      CANDIDATE: a057b4a6243282ef33ea848a5c33157f2a50aa81
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Generate separate training and evaluation datasets
        run: |
          cd "$RUNNER_TEMP"
          curl --retry 3 -fsSLo generator.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo build --locked --release --manifest-path generator/Cargo.toml
          for split in train test; do
            seed="$SEED"
            if [ "$split" = train ]; then seed="$(( SEED + 283 ))"; fi
            generator/target/release/generate --seed "$seed" --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/$split"
          done
          python -m pip install --quiet duckdb==1.4.5
      - name: Build and train each source with identical toolchain and selected ISA
        run: |
          lscpu | grep -E "^Model name|^CPU\(s\)"
          mkdir "$RUNNER_TEMP/engines" "$RUNNER_TEMP/sources" "$RUNNER_TEMP/profiles"
          mkdir "$RUNNER_TEMP/sources/base"
          git archive a057b4a6243282ef33ea848a5c33157f2a50aa81 native | tar -x -C "$RUNNER_TEMP/sources/base"
          mkdir "$RUNNER_TEMP/sources/heavy"
          git archive d2b3a5899e26dabd1fc17c771962550094e2c87e native | tar -x -C "$RUNNER_TEMP/sources/heavy"
          mkdir "$RUNNER_TEMP/sources/tags"
          git archive de94bb5a01a2cf68b153cb8e8ee308fcf7f92ab4 native | tar -x -C "$RUNNER_TEMP/sources/tags"
          mkdir "$RUNNER_TEMP/sources/majority"
          git archive 76bffc7777cc46579ddfcf265222e053144f2851 native | tar -x -C "$RUNNER_TEMP/sources/majority"
          docker build --quiet -t profile-runtime - <<'EOF'
          FROM rust:1.90-slim-bookworm
          RUN apt-get update -qq && apt-get install -yq --no-install-recommends libjemalloc2 patch && rustup component add llvm-tools-preview
          EOF
          docker run --rm -v "$RUNNER_TEMP:/study" -v "$GITHUB_WORKSPACE/.github/workflows:/scripts:ro" profile-runtime bash /scripts/train.sh
      - name: Time held-out input and compare both outputs
        run: python "$GITHUB_WORKSPACE/.github/workflows/time_study.py"
      - uses: actions/upload-artifact@v4
        with:
          name: matched-profiles-${{ matrix.events }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/profiles/*.profdata
