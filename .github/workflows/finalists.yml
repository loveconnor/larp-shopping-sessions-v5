name: Compare the current release, two AMD-specific changes, and their combination
on:
  push:
    branches: [bench/stream-profile-schedule]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed_list: ["346590,298636,626778", "850484,671218,339842", "919705,199465,220123", "426182,824944,138033", "688075,232616,786424", "244079,460341,139490"]
    env:
      SEED_LIST: ${{ matrix.seed_list }}
      RANKED: bf5e73ec8064377d11ba8fcab23369d983df9efa
      CANDIDATE: c1f4dc0dc82197f71ea4bec36722688e2c7cf73f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify compatible native hosts using the production selector
        run: |
          lscpu | grep -E '^Model name:|^CPU family:|^Model:|^Vendor ID:'
          probe="$RUNNER_TEMP/selector-probe"
          mkdir "$probe"
          git show "${CANDIDATE}:native/platform/select-engine.c" > "$probe/selector.c"
          cc -Os -static "$probe/selector.c" -o "$probe/selector"
          for engine in base v3 v4 n4 wide p19; do
            cat > "$probe/selector.$engine" <<'EOF'
          #!/bin/sh
          echo "${0##*.}"
          EOF
            chmod +x "$probe/selector.$engine"
          done
          selected=$("$probe/selector")
          echo "Actual selector chose $selected"
          echo "SELECTED=$selected" >> "$GITHUB_ENV"
      - name: Build the four release images and verify every fallback executable
        if: env.SELECTED == 'p19'
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          for label in ranked candidate sorter combined; do
            sha=$CANDIDATE
            if [ "$label" = ranked ]; then sha=$RANKED; fi
            if [ "$label" = sorter ]; then sha=faf7a64332db78809a950daf53ca0326d906e420; fi
            if [ "$label" = combined ]; then sha=5085884a63d3e70c2a7bdd9702d058d1315dc5d2; fi
            mkdir "$RUNNER_TEMP/$label-src"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/$label-src"
            docker build -q -t "$label" "$RUNNER_TEMP/$label-src"
            cid=$(docker create "$label")
            mkdir "$RUNNER_TEMP/$label"
            docker cp "$cid:/app/." "$RUNNER_TEMP/$label/"
            docker rm "$cid"
          done
          lscpu | grep -E '^CPU family:|^Model:|^Vendor ID:'
          for engine in base v3 v4 n4 wide; do
            for label in candidate sorter combined; do
              cmp "$RUNNER_TEMP/ranked/shopping-sessions.$engine" "$RUNNER_TEMP/$label/shopping-sessions.$engine"
            done
          done
          docker tag ranked control
      - name: Generate fresh data
        if: env.SELECTED == 'p19'
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo build --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml"
          python -m pip install --quiet duckdb==1.4.5
      - name: Measure the mean of the three per-dataset medians
        if: env.SELECTED == 'p19'
        run: python "$GITHUB_WORKSPACE/.github/workflows/final_rehearsal.py"
