name: Compare separator expansion on AVX2 and pre-VBMI2 AVX-512
on:
  push:
    branches: [bench/separator-decoding]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {events: 20000000, format: current, seed: 971821}
          - {events: 60000000, format: current, seed: 971821}
          - {events: 20000000, format: current, seed: 662477}
          - {events: 60000000, format: current, seed: 662477}
    env:
      SEED: ${{ matrix.seed }}
      FORMAT: ${{ matrix.format }}
      EVENTS: ${{ matrix.events }}
      RANKED: 2182f2fd4c92f5fa44fbe9202cfe90533644b3db
      CANDIDATE: 0305122403982f7be66266962ebfd9b8799c9eb3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          for label in ranked; do
            sha=$CANDIDATE
            if [ "$label" = ranked ]; then sha=$RANKED; fi
            if [ "$label" = v4 ]; then sha=47bb8b73aa5f9ee3ac5a11fb1d5b429d0cff3c8a; fi
            mkdir "$RUNNER_TEMP/$label-src"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/$label-src"
            docker build -q -t "$label" "$RUNNER_TEMP/$label-src"
            cid=$(docker create "$label")
            mkdir "$RUNNER_TEMP/$label"
            docker cp "$cid:/app/." "$RUNNER_TEMP/$label/"
            docker rm "$cid"
          done
      - name: Build alternative versions of the selected production engine
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ranked-src"
          docker build -q --target builder -t cc-study .
          mkdir "$RUNNER_TEMP/engines"
          docker run --rm -v "$PWD/native:/pristine:ro" -v "$RUNNER_TEMP/engines:/engines" cc-study sh -ec '
            cd /src
            cp /pristine/src/*.rs src/
            profile=v5
            cpu=x86-64-v3
            features=
            if grep -qw avx512bw /proc/cpuinfo; then
              cpu=x86-64-v4
              profile=n4
              features="--features narrow-v4"
            fi
            for variant in reference flat4 flat5 flat6 flat7 flat8 flat9 flat12 split3 split4 split5 split6; do
              cp /pristine/src/scan.rs src/scan.rs
              case "$variant" in
                reference) ;;
                flat*) lanes=${variant#flat}; sed -i "s/flatten::<10>(sep/flatten::<$lanes>(sep/g" src/scan.rs ;;
                split*) lanes=${variant#split}
                  sed -i "s/flatten::<10>(sep, at, out.add(count))/{ let low = flatten::<$lanes>(sep as u32 as u64, at, out.add(count)); low + flatten::<$lanes>(sep >> 32, at + 32, out.add(count + low)) }/g" src/scan.rs ;;
              esac
              RUSTFLAGS="-C linker=cc -C target-cpu=$cpu -Cprofile-use=/src/profile/$profile.profdata" cargo build --locked --release $features --target x86_64-unknown-linux-gnu
              cp target/x86_64-unknown-linux-gnu/release/shopping-sessions "/engines/$variant"
            done
          '
      - name: Generate fresh data
        run: |
          cd "$RUNNER_TEMP"
          track=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl --retry 3 -fsSLO "$track/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/generator/Cargo.toml" -- \
            --seed "$SEED" --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Measure phase parameters in native restricted Linux processes
        shell: python
        run: |
          import itertools, json, os, pathlib, random, shutil, statistics, subprocess, time
          import duckdb
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          scratch = root / "scratch"
          out = root / "out"
          for d in (scratch,out):
              d.mkdir()
              d.chmod(0o777)
          cid = subprocess.check_output(["docker","run","-d","--runtime","runc","--memory","12g","--memory-swap","12g","--network","none","--read-only","--cap-drop","ALL","--user","1000:1000","--tmpfs","/tmp:rw,size=64m","-e","NCPU=8","-e","DATA_DIR=/data","-e","OUTPUT_DIR=/output","-e","SCRATCH_DIR=/scratch","-v",f"{root}/data:/data:ro","-v",f"{root}/engines:/engines:ro","-v",f"{out}:/output","-v",f"{scratch}:/scratch","ranked","sleep","1800"],text=True).strip()
          def run(env):
              subprocess.run(["docker","exec",cid,"rm","-rf","/output/campaign_daily","/output/user_daily"],check=True)
              binary = "/engines/" + env if env else "/engines/reference"
              started=time.monotonic()
              subprocess.run(["docker","exec",cid,binary],capture_output=True,text=True,check=True)
              return time.monotonic()-started
          run("")
          ref = root / "ref"
          shutil.copytree(out,ref)
          candidates = [""] + sorted(path.name for path in (root / "engines").iterdir() if path.name != "reference")
          rng=random.Random(int(os.environ["SEED"]))
          samples=[[] for _ in candidates]
          def stage(ids,rounds):
              for _ in range(rounds):
                  rng.shuffle(ids)
                  for ix in ids: samples[ix].append(run(candidates[ix]))
          stage(list(range(len(candidates))),3)
          idx=sorted(range(len(samples)),key=lambda ix:statistics.median(samples[ix]))[:5]
          if 0 not in idx: idx.append(0)
          stage(idx,8)
          for ix in sorted(range(len(samples)),key=lambda ix:statistics.median(samples[ix])):
              print("TUNE",json.dumps(candidates[ix]),len(samples[ix]),round(statistics.median(samples[ix])/statistics.median(samples[0]),4),flush=True)
          winner=min(idx,key=lambda ix:statistics.median(samples[ix]))
          run(candidates[winner])
          for t in ("user_daily","campaign_daily"):
              a,b=[f"SELECT * FROM read_parquet('{d}/{t}/*.parquet')" for d in (out,ref)]
              for x,y in ((a,b),(b,a)):
                  assert duckdb.sql(f"SELECT count(*) FROM ({x} EXCEPT ALL {y})").fetchone()[0]==0
          subprocess.run(["docker","rm","-f",cid],check=True)
