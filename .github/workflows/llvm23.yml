name: Train practice- and final-size profiles on matching native machines
on:
  push:
    branches: [bench/size-specific-profiles]
permissions:
  contents: read
jobs:
  profile:
    strategy:
      matrix:
        seed: [311951, 311957, 311963, 311981]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a057b4a6243282ef33ea848a5c33157f2a50aa81
      - name: Generate v5 training input and collect LLVM counters
        run: |
          lscpu | grep -E "^Model name|^CPU\(s\)"
          cd "$RUNNER_TEMP"
          curl -fsSLO https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo build --release --locked --manifest-path generator/Cargo.toml
          for rows in 20000000 60000000; do
            generator/target/release/generate --seed "$(( ${{ matrix.seed }} + rows / 1000 ))" --events "$rows" --clicks "$(( rows / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/train-$rows"
          done
          mkdir "$RUNNER_TEMP/profile"
          docker run --rm -v "$GITHUB_WORKSPACE/native:/src:ro" -v "$RUNNER_TEMP:/work" rust:1.90-slim-bookworm sh -ec '
            cp -a /src /tmp/native
            cd /tmp/native
            apt-get update -qq && apt-get install -yq --no-install-recommends patch
            rustup component add llvm-tools-preview
            merger="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
            levels=v3
            if grep -qw avx512bw /proc/cpuinfo; then
              levels=n4
              if grep -qw avx512_vbmi2 /proc/cpuinfo; then levels="n4 wide"; fi
            fi
            for level in $levels; do
              cpu=x86-64-$level
              feature=
              build_features=
              if [ "$level" = n4 ]; then cpu=x86-64-v4; build_features="--features narrow-v4"; fi
              if [ "$level" != v3 ]; then
                grep -qw avx512bw /proc/cpuinfo || continue
              fi
              if [ "$level" = wide ]; then
                grep -qw avx512_vbmi2 /proc/cpuinfo || continue
                patch -p2 < platform/wide.patch
                cpu=x86-64-v4
                feature="-C target-feature=+avx512vbmi2"
              fi
              RUSTFLAGS="-C target-cpu=$cpu $feature -Cprofile-generate=/tmp/profile" cargo build --release --locked $build_features --target x86_64-unknown-linux-gnu
              for rows in 20000000 60000000; do
                mkdir -p /work/profile/$level-$rows
                LLVM_PROFILE_FILE="/work/profile/$level-$rows/%m.profraw" NCPU=8 DATA_DIR="/work/train-$rows" OUTPUT_DIR="/work/out-$level-$rows" target/x86_64-unknown-linux-gnu/release/shopping-sessions
                "$merger" merge --sparse /work/profile/$level-$rows/*.profraw -o /work/profile/$level-$rows.profdata
              done
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-counters-${{ matrix.seed }}
          path: ${{ runner.temp }}/profile/*.profdata
